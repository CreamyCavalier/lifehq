<!doctype html>
<html lang="en">
<head>

<style>
:root{
  --bg:#FFFFFF; --fg:#0D0D0D; --muted:#5E5E5E; --rule:#0D0D0D; --hair:#DCDCDC;
  --bar:#0D0D0D; --bar-fg:#FFFFFF; --soft:#F2F2F2;
  --f:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0B0B; --fg:#F2F2F2; --muted:#A3A3A3; --rule:#F2F2F2; --hair:#2E2E2E;
  --bar:#F2F2F2; --bar-fg:#0B0B0B; --soft:#1A1A1A; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);
  padding:18px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));
  display:flex;justify-content:space-between;align-items:flex-end}
.mast b{font-weight:900;font-size:15px;line-height:1.15}
.mast span{font-size:13px;font-weight:500;text-align:right;line-height:1.25}
main{flex:1;padding:22px max(20px,env(safe-area-inset-right,0px)) 130px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:30px}
section{display:flex;flex-direction:column;gap:30px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:16px;border-top:2px solid var(--rule);padding-top:16px}
.row>.lab{font-size:13px;font-weight:500}
.row>.lab .n{display:block;font-size:32px;font-weight:900;line-height:1.05}
.big{font-size:clamp(72px,24vw,96px);font-weight:900;line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.lead{font-size:20px;font-weight:700;line-height:1.3}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:4px 0;font-size:17px;line-height:1.35}
.item input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--fg);flex:none}
.item .meta{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:3px}
.done{text-decoration:line-through;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.times{display:grid;grid-template-columns:52px minmax(0,1fr);row-gap:12px;column-gap:8px;font-size:17px;font-variant-numeric:tabular-nums}
.times b{font-weight:700}
a{color:var(--fg)}
button{font:600 15px var(--f);color:var(--fg);background:var(--bg);border:2px solid var(--rule);border-radius:0;padding:10px 14px;cursor:pointer}
button.solid{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],textarea{font:16px var(--f);color:var(--fg);background:var(--bg);border:2px solid var(--rule);border-radius:0;padding:10px 12px;min-width:0}
details.brief{border:2px solid var(--rule)}
details.brief summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between}
details.brief summary::-webkit-details-marker{display:none}
details.brief summary::after{content:"+";font-weight:900}
details.brief[open] summary::after{content:"−"}
.brief-body{padding:4px 14px 16px;white-space:pre-wrap;font-size:16px;line-height:1.45}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--hair);padding:8px 10px}
.err{font-size:14px;border-left:4px solid var(--fg);padding:6px 10px;background:var(--soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--rule);
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{border:0;border-top:4px solid transparent;margin-top:-2px;background:transparent;padding:14px 0;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{border-top-color:var(--fg);color:var(--fg);font-weight:700}
.overlay{position:fixed;inset:0;z-index:20;background:var(--bar);color:var(--bar-fg);overflow:auto;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.overlay .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.overlay h1{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance}
.overlay .text{white-space:pre-wrap;font-size:18px;line-height:1.5}
.overlay button{background:var(--bar-fg);color:var(--bar);border-color:var(--bar-fg);align-self:flex-start;padding:14px 22px;font-size:17px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;white-space:pre-wrap;padding:10px 12px;font-size:16px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--bg)}
.msg.ai{align-self:flex-start;border:2px solid var(--rule)}
.chip{align-self:flex-start;font-size:13px;color:var(--muted);border:1px solid var(--hair);padding:3px 8px}
.composer{position:fixed;left:0;right:0;bottom:calc(52px + max(14px,env(safe-area-inset-bottom,0px)));z-index:6;background:var(--bg);border-top:1px solid var(--hair)}
.composer .in{max-width:560px;margin:0 auto;display:flex;gap:8px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
.composer textarea{flex:1;resize:none;height:46px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{font-weight:500;font-size:14px;padding:8px 10px;border-width:1px}
.sr{position:absolute;left:-9999px}
.gate{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.gate h2{font-size:28px;font-weight:900;margin:0;letter-spacing:-.02em}
</style>
</head>
<body>
<div class="app">
  <header class="mast"><b id="m-date">—<br>—</b><span id="m-count">Life HQ</span></header>
  <main id="main">
    <section id="v-gate" hidden></section>
    <section id="v-today" aria-label="Today"></section>
    <section id="v-week" aria-label="Week" hidden></section>
    <section id="v-chat" aria-label="Chat" hidden></section>
    <section id="v-todo" aria-label="To-do" hidden></section>
  </main>
</div>
<div class="composer" id="composer" hidden><div class="in">
  <label for="chat-in" class="sr">Message</label>
  <textarea id="chat-in" placeholder="Ask anything"></textarea>
  <button class="solid" id="chat-send">Send</button>
</div></div>
<nav class="tabs" id="tabs"><div class="in" role="tablist">
  <button role="tab" id="t-today" aria-selected="true">Today</button>
  <button role="tab" id="t-week" aria-selected="false">Week</button>
  <button role="tab" id="t-chat" aria-selected="false">Chat</button>
  <button role="tab" id="t-todo" aria-selected="false">To-do</button>
</div></nav>
<div class="overlay" id="overlay" hidden></div>

<script>
(function(){
"use strict";
// ================= config =================
const CLIENT_ID = "797832128341-b0f131prlbal93v73pu0gidcqoinb5u3.apps.googleusercontent.com";            // Google OAuth client id (not secret)
const CAL_CLASSES = "primary";
const CAL_ASSIGN  = "4p8hgue4j0cdpobmoo3f3sd542huf70f@import.calendar.google.com";
const AUDITION = "2026-11-14";
const READER = "https://claude.ai/artifact/ThEjaprnmHNKL7Wtj4HXfr";
const LEAVE_MIN = 25;
const SCOPES = [
  "https://www.googleapis.com/auth/calendar.events",
  "https://www.googleapis.com/auth/gmail.readonly",
  "https://www.googleapis.com/auth/gmail.compose",
  "https://www.googleapis.com/auth/drive.readonly",
  "https://www.googleapis.com/auth/drive.file"
].join(" ");
const INBOX_NAME = "Life HQ inbox";               // Google Doc the app writes; Claude reads it
const SYNC_PREFIX = "lifehq-sync-";               // JSON files Claude writes; app reads newest

// ================= helpers =================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000);
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const dowOf = s => DOW[new Date(s+"T12:00:00").getDay()];
const fmtTime = d => { const h = d.getHours(), m = d.getMinutes(); return `${((h+11)%12)+1}:${pad(m)}`; };
const store = { get(k,d){ try{ const v = localStorage.getItem("lhq-"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem("lhq-"+k, JSON.stringify(v)); }catch(e){} } };
const short = name => String(name||"")
  .replace(/^Mathematical Reasoning, Logic, and Statistics.*$/i,"Math")
  .replace(/^AP French.*$/i,"AP French").replace(/^AP English.*$/i,"AP English Lit")
  .replace(/^Honors Jazz Ensemble.*$/i,"Jazz Ensemble").replace(/^Psychology in Film.*$/i,"Psych in Film")
  .replace(/^Living Well.*$/i,"Living Well").replace(/^US Academic Advisory.*$/i,"Advisory")
  .replace(/\s+-\s+\d+\s*\(.*$/,"").trim();
const clean = s => { const t = document.createElement("textarea"); t.innerHTML = String(s||""); return t.value.replace(/ /g," ").trim(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = ymd(new Date());
const daysLeft = dayDiff(today, AUDITION);
const whenLabel = at => { const d = new Date(at); if (isNaN(d)) return ""; const ds = ymd(d); const day = ds === today ? "Today" : ds === addDays(today,1) ? "Tomorrow" : DOW[d.getDay()].slice(0,3)+" "+d.getDate(); return `${day} ${fmtTime(d)}${d.getHours()<12?"am":"pm"}`; };

function plan(d){
  const alt = new Date(d+"T12:00:00").getDate() % 2 === 0 ? "Improvise over Althea's changes, 20 min" : "Ear training: sing a 3–4 note phrase, find it on guitar, 20 min";
  if (d > AUDITION) return { phase:"After the audition", tasks:["Free practice, whatever you enjoy","15 min reading to keep it going"] };
  if (d === AUDITION) return { phase:"Audition day", tasks:["Warm up slowly, 20 min","Run the opening and the solo once each, no more"] };
  if (d <= "2026-10-28") return { phase:"Learn Althea", tasks:["Althea: confirm the cut, map it bar by bar, learn the intro riff and verse/chorus, 45 min","Sight-reading: Name the note on G, B, high E (10 min), then Read a line, basic rhythms at 45 bpm (15 min)", alt] };
  if (d <= "2026-11-02"){
    const sec = {"2026-10-29":"the bridge","2026-10-30":"the solo","2026-10-31":"the solo, slower","2026-11-01":"the outro, and finish the backing track","2026-11-02":"the weakest section so far"}[d];
    const read = d <= "2026-10-30" ? "Sight-reading: top three strings, 45–50 bpm, 25 min" : "Sight-reading: from the D string up, add eighth notes, 55 bpm, 25 min";
    return { phase:"Learn Althea", tasks:[`Althea: ${sec}, slow to tempo, 45 min`, read, alt] };
  }
  if (d <= "2026-11-04") return { phase:"First full runs", tasks:["Althea: two full run-throughs with the backing track, 40 min","Draft interview answers: why Berklee, goals, influences, 20 min","Sight-reading: D string up with eighths, 55 bpm, 25 min"] };
  if (d <= "2026-11-10") return { phase:"Performance mode", tasks:["Althea: one recorded full run, then fix the worst moment, 45 min"+(d==="2026-11-07"?" (mock audition in front of someone today)":""),"Sight-reading: all six strings, 60+ bpm, plus one cold read, 25 min", alt] };
  return { phase:"Taper", tasks:[d==="2026-11-13"?"One light run, then an early night":"Althea: 1–2 full runs, no new material", d==="2026-11-11"?"Change strings today so they settle":"Check gear, cables and a backup of the backing track","Sight-reading: 10 min light review"] };
}

// ================= state =================
const S = { classes:null, classErr:null, assign:null, assignErr:null, mail:null, mailErr:null, sync:null, syncErr:null,
  inbox: store.get("inbox", { items: [] }), chat: store.get("chat", []), busy:false };
let token = store.get("token", null);

// ================= Google auth =================
let tokenClient = null, authWaiters = [];
function tokenValid(){ return token && token.access_token && token.expires_at > Date.now() + 60000; }
function initAuth(){
  if (tokenClient || !window.google || !google.accounts || !google.accounts.oauth2) return !!tokenClient;
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: r => {
    if (r && r.access_token){ token = { access_token:r.access_token, expires_at: Date.now() + (r.expires_in||3600)*1000 }; store.set("token", token); store.set("authed", true); }
    const w = authWaiters; authWaiters = []; w.forEach(f => f(!!(r && r.access_token)));
  }, error_callback: () => { const w = authWaiters; authWaiters = []; w.forEach(f => f(false)); } });
  return true;
}
function signIn(silent){
  return new Promise(res => { if (!initAuth()) return res(false); authWaiters.push(res); tokenClient.requestAccessToken({ prompt: silent ? "" : (store.get("authed",false) ? "" : "consent") }); });
}
async function g(url, opts={}){
  if (!tokenValid()) throw { code:"auth" };
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + token.access_token }, opts.headers||{}) }));
  if (r.status === 401) { token = null; store.set("token", null); throw { code:"auth" }; }
  if (!r.ok) { let m = ""; try { m = (await r.json()).error.message; } catch(e){} throw { code:"http", status:r.status, message:m }; }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("json") ? r.json() : r.text();
}
const errCopy = (e, what) => e && e.code === "auth" ? `Sign in again to load ${what}.` : e && e.status === 403 ? `Google refused access to ${what}${e.message?": "+e.message:""}.` : `Couldn't load ${what} just now.`;

// ================= data =================
const CAL = "https://www.googleapis.com/calendar/v3";
async function listEvents(cal, start, end){
  const q = new URLSearchParams({ timeMin:new Date(start+"T00:00:00").toISOString(), timeMax:new Date(end+"T00:00:00").toISOString(), singleEvents:"true", orderBy:"startTime", maxResults:"250" });
  const r = await g(`${CAL}/calendars/${encodeURIComponent(cal)}/events?${q}`); return r.items || [];
}
async function loadClasses(){
  try { S.classes = (await listEvents(CAL_CLASSES, addDays(today,-1), addDays(today,8)))
      .filter(e => e.start && e.start.dateTime && e.status !== "cancelled")
      .map(e => ({ id:e.id, name:short(e.summary), full:e.summary||"", room:(e.location||"").split(" - ")[0], start:new Date(e.start.dateTime), date:ymd(new Date(e.start.dateTime)) }));
    S.classErr = null; } catch(e){ S.classErr = e; }
}
async function loadAssign(){
  try { S.assign = (await listEvents(CAL_ASSIGN, addDays(today,-60), addDays(today,15))).map(e => {
      const st = String((e.start && (e.start.date || e.start.dateTime)) || "").slice(0,10);
      const en = String((e.end && (e.end.date || e.end.dateTime)) || "").slice(0,10);
      const due = en ? addDays(en,-1) : st;
      const sum = clean(e.summary); const i = sum.indexOf(": ");
      let cls = i > 0 ? sum.slice(0,i) : "", title = i > 0 ? sum.slice(i+2) : sum;
      if (/click here to view/i.test(title) && e.description) title = clean(e.description).slice(0,90);
      return { id:e.id, cls:short(cls), clsFull:cls, title, due, long: dayDiff(st, en) > 30 };
    }).filter(a => a.due); S.assignErr = null; } catch(e){ S.assignErr = e; }
}
const GM = "https://gmail.googleapis.com/gmail/v1/users/me";
async function gmailSearch(q, n){
  const r = await g(`${GM}/threads?${new URLSearchParams({ q, maxResults:String(n) })}`);
  const th = (r.threads || []).slice(0, n);
  return Promise.all(th.map(async t => {
    const d = await g(`${GM}/threads/${t.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=To&metadataHeaders=Date`);
    const m = (d.messages||[])[0] || {}; const H = n => ((m.payload&&m.payload.headers)||[]).find(h => h.name === n)?.value || "";
    return { id:t.id, from:H("From"), subject:clean(H("Subject"))||"(no subject)", to:H("To"), date:H("Date"), snippet:clean(m.snippet||d.snippet||""), url:`https://mail.google.com/mail/u/0/#inbox/${t.id}` };
  }));
}
async function loadMail(){
  try { const all = await gmailSearch("in:inbox newer_than:3d -category:promotions -category:social -category:forums", 15);
    S.mail = all.filter(m => /@sssas\.org>?$|myschoolapp\.com>?$/i.test(m.from) && !/usstudents|usemployees|allstudents/i.test(m.to) && (m.to.match(/@/g)||[]).length <= 6).slice(0,5);
    S.mailErr = null; } catch(e){ S.mailErr = e; }
}
const DRV = "https://www.googleapis.com/drive/v3";
async function loadSync(){
  try {
    const r = await g(`${DRV}/files?${new URLSearchParams({ q:`name contains '${SYNC_PREFIX}' and trashed = false`, orderBy:"createdTime desc", pageSize:"1", fields:"files(id,name,createdTime)" })}`);
    const f = (r.files||[])[0];
    if (!f) { S.sync = null; S.syncErr = null; return; }
    const txt = await g(`${DRV}/files/${f.id}?alt=media`);
    S.sync = typeof txt === "string" ? JSON.parse(txt) : txt; S.sync._file = f; S.syncErr = null;
    // drop inbox items Claude has already processed
    const done = new Set(S.sync.processedInbox || []);
    const before = S.inbox.items.length; S.inbox.items = S.inbox.items.filter(it => !done.has(it.id));
    if (S.inbox.items.length !== before) { store.set("inbox", S.inbox); }
  } catch(e){ S.syncErr = e; }
}
// inbox: a Google Doc this app owns; Claude reads it at each brief
let inboxTimer = null;
function queue(item){ item.id = item.id || uid(); item.at = new Date().toISOString(); S.inbox.items.push(item); store.set("inbox", S.inbox); clearTimeout(inboxTimer); inboxTimer = setTimeout(pushInbox, 1500); renderAll(); }
async function pushInbox(){
  if (!tokenValid()) return;
  const body = "LIFE HQ INBOX (written by the Life HQ home-screen app). JSON:\n" + JSON.stringify({ updated:new Date().toISOString(), items:S.inbox.items });
  const meta = { name: INBOX_NAME, mimeType: "application/vnd.google-apps.document" };
  const boundary = "lhq" + uid();
  const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${body}\r\n--${boundary}--`;
  try {
    let id = store.get("inboxId", null);
    if (id) await g(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`, { method:"PATCH", headers:{ "Content-Type":`multipart/related; boundary=${boundary}` }, body:multipart });
    else { const r = await g(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`, { method:"POST", headers:{ "Content-Type":`multipart/related; boundary=${boundary}` }, body:multipart }); store.set("inboxId", r.id); }
    store.set("inboxPushed", Date.now());
  } catch(e){ if (e && e.status === 404) { store.set("inboxId", null); } }
}

// ================= merged views =================
const dueOn = d => (S.assign||[]).filter(a => !a.long && a.due === d);
function doneMap(){ const m = Object.assign({}, (S.sync && S.sync.done) || {}); S.inbox.items.forEach(it => { if (it.type === "assignmentDone") { if (it.value) m[it.ref] = true; else delete m[it.ref]; } }); return m; }
function practiceMap(){ const p = Object.assign({}, (S.sync && S.sync.practice) || {}); S.inbox.items.forEach(it => { if (it.type === "practice") p[it.date] = { minutes: it.minutes }; }); return p; }
function todos(){
  const list = ((S.sync && S.sync.todos) || []).map(t => Object.assign({}, t));
  S.inbox.items.forEach(it => {
    if (it.type === "todo" || it.type === "reminder") list.push({ id:it.id, text:it.text, when:it.when||"", dueAt:it.dueAt||"", reminder:it.type==="reminder", done:false, pending:true });
    if (it.type === "todoDone") { const t = list.find(x => x.id === it.ref); if (t) t.done = !!it.value; }
  });
  return list;
}

// ================= render: Today =================
function nextUp(){
  const now = new Date(), todays = (S.classes||[]).filter(c => c.date === today);
  const first = todays[0];
  if (first && now < first.start) return { kind:"leave", leave:new Date(first.start - LEAVE_MIN*60000), cls:first };

const FN = [
  { name:"get_schedule", description:"Calendar events (classes etc.) for a date YYYY-MM-DD.", parameters:{ type:"OBJECT", properties:{ date:{ type:"STRING" } }, required:["date"] } },
  { name:"get_assignments", description:"Assignments due between two dates inclusive (YYYY-MM-DD).", parameters:{ type:"OBJECT", properties:{ from:{ type:"STRING" }, to:{ type:"STRING" } }, required:["from","to"] } },

  { name:"add_calendar_event", description:"Add an event to his Google Calendar. start/end local ISO like 2026-10-27T18:30:00.", parameters:{ type:"OBJECT", properties:{ summary:{ type:"STRING" }, start:{ type:"STRING" }, end:{ type:"STRING" } }, required:["summary","start","end"] } },
  { name:"save_email_draft", description:"Save (never send) a Gmail draft.", parameters:{ type:"OBJECT", properties:{ to:{ type:"STRING" }, subject:{ type:"STRING" }, body:{ type:"STRING" } }, required:["subject","body"] } },

  { name:"set_reminder", description:"Set a reminder; his phone alerts 15 minutes before. at = local ISO like 2026-10-27T16:00:00.", parameters:{ type:"OBJECT", properties:{ text:{ type:"STRING" }, at:{ type:"STRING" } }, required:["text","at"] } },

let chips = [];
async function runFn(name, a){
  if (name === "get_schedule"){ const d = String(a.date||today); return (await listEvents(CAL_CLASSES, d, addDays(d,1))).filter(e=>e.start&&e.start.dateTime).map(e=>({ time:fmtTime(new Date(e.start.dateTime)), what:short(e.summary), room:(e.location||"").split(" - ")[0] })); }
  if (name === "get_assignments"){ if (!S.assign) await loadAssign(); return (S.assign||[]).filter(x=>!x.long && x.due>=String(a.from) && x.due<=String(a.to)).map(x=>({ due:x.due, class:x.cls, title:x.title, done:!!doneMap()[x.id] })); }
  if (name === "search_email"){ return (await gmailSearch(String(a.query), 8)).map(m=>({ from:m.from, subject:m.subject, snippet:m.snippet, date:m.date })); }
  if (name === "add_calendar_event"){ await g(`${CAL}/calendars/primary/events`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ summary:String(a.summary), start:{ dateTime:new Date(String(a.start)).toISOString() }, end:{ dateTime:new Date(String(a.end)).toISOString() } }) }); chips.push("Added to calendar: "+a.summary); return { ok:true }; }
  if (name === "save_email_draft"){
    const raw = `To: ${String(a.to||"")}\r\nSubject: ${String(a.subject)}\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n${String(a.body)}`;
    const b64 = btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    await g(`${GM}/drafts`, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ message:{ raw:b64 } }) }); chips.push("Draft saved: "+a.subject); return { saved:true, sent:false }; }
  if (name === "add_todo"){ queue({ type:"todo", text:String(a.text) }); chips.push("To-do added: "+a.text); return { ok:true }; }
  if (name === "set_reminder"){ const ok = await addReminder(String(a.text), String(a.at)); chips.push(`Reminder: ${a.text} · ${whenLabel(String(a.at))}`); return { ok:true, phoneAlert:ok }; }
  throw new Error("unknown function");
}
async function send(){
  const box = $("chat-in"), text = box.value.trim(); if (!text || S.busy) return;
  const key = store.get("gemkey",""); if (!key){ S.chat.push({ role:"user", content:text }, { role:"model", content:"Add your Gemini API key in To-do → Settings first, then try again." }); box.value=""; renderChat(); return; }
  S.busy = true; box.value = ""; chips = []; S.chat.push({ role:"user", content:text }); renderChat();
  $("chat-live").innerHTML = `<div class="msg ai">Thinking…</div>`; window.scrollTo(0, document.body.scrollHeight);
  const model = await pickModel(key);
  const contents = S.chat.slice(-24).map(t => ({ role: t.role === "user" ? "user" : "model", parts:[{ text:t.content }] }));
  let out = "";
  try {
    for (let round = 0; round < 6; round++){
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ systemInstruction:{ parts:[{ text:systemText() }] }, contents, tools:[{ functionDeclarations:FN }], generationConfig:{ temperature:0.7, maxOutputTokens:900 } }) });
      if (r.status === 429) { out = "Gemini's free limit is used up for now. Try again in a minute."; break; }
      const data = await r.json(); if (!r.ok) { out = "Chat error: " + ((data.error && data.error.message) || r.status); break; }
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const calls = parts.filter(p => p.functionCall);
      if (!calls.length) { out = parts.map(p => p.text || "").join("").trim() || "…"; break; }
      contents.push({ role:"model", parts });
      const responses = [];
      for (const c of calls) { let res; try { res = await runFn(c.functionCall.name, c.functionCall.args || {}); } catch(e){ res = { error: (e && (e.message || e.code)) || "failed" }; } responses.push({ functionResponse:{ name:c.functionCall.name, response:{ result:res } } }); }
      contents.push({ role:"user", parts:responses });
    }
  } catch(e){ out = "Couldn't reach the chat. Check your connection."; }
  S.chat.push({ role:"model", content:out || "…", chips:chips.slice() }); S.chat = S.chat.slice(-40); store.set("chat", S.chat);
  S.busy = false; renderChat(); window.scrollTo(0, document.body.scrollHeight);
}
function renderChat(){
  const v = $("v-chat"); let h = `<div class="chat">`;
  if (!S.chat.length) h += `<p class="muted" style="margin:0">Ask anything. I can see your classes, assignments and school email, add things to your calendar, save email drafts (never send), set reminders and add to-dos.</p>

}
VIEWS.forEach(v => $("t-"+v).onclick = () => setTab(v));
$("chat-send").onclick = send;
$("chat-in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
function renderAll(){ renderToday(); renderWeek(); renderTodo(); if (!$("v-chat").hidden) renderChat(); }
function renderMast(){ $("m-date").innerHTML = `${today.slice(8)}.${today.slice(5,7)}<br>${dowOf(today)}`; $("m-count").innerHTML = daysLeft > 0 ? `Berklee<br>−${daysLeft} days` : daysLeft === 0 ? "Berklee<br>today" : "Life HQ"; }
function showGate(msg){
  VIEWS.forEach(v => $("v-"+v).hidden = true); $("tabs").hidden = true; $("composer").hidden = true;
  const v = $("v-gate"); v.hidden = false;
  v.innerHTML = `<div class="gate"><h2>Life HQ</h2><p class="muted" style="margin:0">${esc(msg || "Sign in with your school Google account to load your classes, assignments and email.")}</p>
    <button class="solid" id="go-signin" style="align-self:flex-start;padding:14px 22px;font-size:17px">Sign in with Google</button>
    ${CLIENT_ID.startsWith("PASTE") ? `<p class="err">This copy isn't set up yet: the Google Client ID is missing.</p>` : ""}</div>`;
  $("go-signin").onclick = async () => { const ok = await signIn(false); if (ok) start(); else showGate("Sign-in didn't finish. If Google said the app is blocked, your school may not allow it."); };
}
function hideGate(){ $("v-gate").hidden = true; $("tabs").hidden = false; setTab(VIEWS.includes(store.get("tab","today")) ? store.get("tab","today") : "today"); }
async function refresh(){ await Promise.all([loadClasses(), loadAssign(), loadMail(), loadSync()]); renderAll(); }
async function start(){
  hideGate(); renderAll();
  await refresh();
  if (S.classErr && S.classErr.code === "auth") { const ok = await signIn(true); if (ok) await refresh(); else return showGate("Your Google sign-in expired. Sign in again to continue."); }
  maybeShowOverlay();
  if (S.inbox.items.length) pushInbox();
}
renderMast();
document.addEventListener("visibilitychange", async () => { if (document.hidden) return; if (ymd(new Date()) !== today) return location.reload(); if (!tokenValid() && store.get("authed",false)) { const ok = await signIn(true); if (!ok) return; } if (tokenValid()) refresh(); });
(function boot(){
  if (tokenValid()) return start();
  if (store.get("authed", false)) {
    const wait = () => window.google && google.accounts ? signIn(true).then(ok => ok ? start() : showGate("Tap to sign in again.")) : setTimeout(wait, 150);
    return wait();
  }
  showGate();
})();
})();
</script>
</body>
